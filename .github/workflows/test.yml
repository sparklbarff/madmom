name: Tests

on:
  push:
    branches: [ main, numpy2-migration ]
  pull_request:
    branches: [ main, numpy2-migration ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
        exclude:
          # Python 3.14 may not be available on all runners yet
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install pytest pytest-cov

    - name: Verify Cython compilation
      run: |
        python -c "import madmom.audio.comb_filters; import madmom.features.beats_crf; import madmom.ml.hmm; print('Cython extensions compiled successfully')"

    - name: Verify model submodule
      run: |
        python -c "from madmom.models import BEATS_LSTM; print('Models loaded successfully')"

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short

    - name: Test on Python 3.14 (if available)
      if: matrix.python-version == '3.14' && matrix.os == 'macos-latest'
      run: |
        pytest tests/ -v --tb=short

