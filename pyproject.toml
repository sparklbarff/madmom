[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "cython>=0.25",
    "numpy>=2.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "madmom"
version = "0.17.dev0"
description = "Python audio signal processing library with focus on music information retrieval"
readme = "README.rst"
license = {text = "BSD-3-Clause AND CC-BY-NC-SA-4.0"}
requires-python = ">=3.12"
authors = [
    {name = "Department of Computational Perception, JKU Linz & OFAI Vienna", email = "madmom-users@googlegroups.com"},
]
maintainers = [
    {name = "Travis Inskeep", email = "sparklbarff@users.noreply.github.com"},
]
keywords = [
    "audio",
    "music",
    "signal processing",
    "MIR",
    "music information retrieval",
    "beat tracking",
    "tempo estimation",
    "onset detection",
    "chord recognition",
    "neural network",
    "machine learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Cython",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "mido>=1.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/CPJKU/madmom"
Documentation = "https://madmom.readthedocs.io"
Repository = "https://github.com/sparklbarff/madmom.git"
Issues = "https://github.com/sparklbarff/madmom/issues"
Changelog = "https://github.com/CPJKU/madmom/blob/master/CHANGES.rst"

# CLI scripts are installed via setup.py scripts= directive
# See bin/ directory for standalone command-line tools

[tool.setuptools]
script-files = [
    "bin/BarTracker",
    "bin/BeatDetector",
    "bin/BeatTracker",
    "bin/CNNChordRecognition",
    "bin/CNNOnsetDetector",
    "bin/ComplexFlux",
    "bin/CRFBeatDetector",
    "bin/DBNBeatTracker",
    "bin/DBNDownBeatTracker",
    "bin/DCChordRecognition",
    "bin/evaluate",
    "bin/GMMPatternTracker",
    "bin/KeyRecognition",
    "bin/LogFiltSpecFlux",
    "bin/MMBeatTracker",
    "bin/OnsetDetector",
    "bin/OnsetDetectorLL",
    "bin/PianoTranscriptor",
    "bin/PickleProcessor",
    "bin/SpectralOnsetDetection",
    "bin/SuperFlux",
    "bin/SuperFluxNN",
    "bin/TCNBeatTracker",
    "bin/TCNTempoDetector",
    "bin/TempoDetector",
]
# madmom.models added 2026-08-15. Without it the 34M of model data still installs via the
# package-data globs below, but madmom/models/__init__.py — the module defining BEATS_LSTM,
# ONSETS_CNN, KEY_CNN, DOWNBEATS_BLSTM as importable constants — does not. The package then
# imports cleanly while every neural capability raises "cannot import name ... (unknown location)"
# on processor instantiation. It fails SILENTLY: callers set MADMOM_AVAILABLE from whether the
# feature classes import, which succeeds, so tools report the neural path active and quietly fall
# back to heuristics.
packages = ["madmom", "madmom.models", "madmom.audio", "madmom.evaluation", "madmom.features", "madmom.io", "madmom.ml", "madmom.ml.nn", "madmom.utils"]
include-package-data = true

# Year-pinned globs are a trap here, and 2026-08-15 sprung it. `models/beats/201[56]/*` matched
# the two model years that existed when it was written and silently stopped at the third:
# madmom/models/__init__.py:40 defines BEATS_TCN = models("beats/2019/beats_tcn_[1-8].pkl"), the
# eight .pkl files are present in the source tree, and they were simply never packaged. models()
# is `return sorted(glob.glob(...))`, so a miss yields [] rather than raising — TCNBeatProcessor
# constructs fine and dies later on use with "IndexError: list index out of range", naming
# nothing, while bin/TCNBeatTracker and bin/TCNTempoDetector ship as console scripts regardless.
# That is the default beat tracker, dark since the packaging commit.
#
# So every family globs */* now. `models/key/2018/*` had the identical shape and was latent only
# because no constant references key/2017 yet; leaving it would have preserved the bug for the
# next model year. Cost is ~4.9 MB of unreferenced models (beats/2013, key/2017) in the wheel,
# which is a fraction of the 34 MB already shipping and much cheaper than a silently dead engine.
#
# This list and the constants in madmom/models/__init__.py are two lists that must agree, with
# nothing checking that they do. tests/test_model_constants_resolve.py is that check.
[tool.setuptools.package-data]
madmom = [
    "models/LICENSE",
    "models/README.rst",
    "models/beats/*/*",
    "models/chords/*/*",
    "models/chroma/*/*",
    "models/downbeats/*/*",
    "models/key/*/*",
    "models/notes/*/*",
    "models/onsets/*/*",
    "models/patterns/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
# Fleet pin is black 25.11.0 at 100 columns. This section did not exist before,
# so black fell back to its 88 default while upstream's pre-commit entry passed
# -l 120 on the command line: the width depended on how black was invoked.
# -S (skip string normalization) is deliberately NOT carried over from that entry.
line-length = 100
target-version = ["py312"]

[tool.ruff]
# py39 contradicted requires-python = ">=3.12" above, which held the UP rules
# back from modernising the tree to the Python it actually runs on.
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "NPY201", # NumPy 2.0 compatibility
]
ignore = [
    "E501",   # line too long (handled by formatter)
    # F403/F405 are mis-specified for this codebase rather than tolerated in it.
    # madmom's package layout is deliberately built on `from .x import *`, so
    # these two fire 3920 times across the tree: 93% of every finding ruff had.
    # Left on, they bury the 292 findings that are actually about defects.
    "F403",   # star import used
    "F405",   # name may be undefined, or defined from star imports
]

[tool.ruff.lint.isort]
known-first-party = ["madmom"]

[tool.coverage.run]
source = ["madmom"]
omit = ["*/tests/*", "*/models/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
