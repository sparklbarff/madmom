# madmom2025 commit gate. Fleet-aligned, and a REWRITE of upstream's config
# rather than an adoption of it.
#
# Installing hooks here only became correct on 2026-08-28, when this fork was
# severed from CPJKU/madmom. The entire case for leaving the gate off was that
# reformatting destroys diffability against upstream. There is no upstream to
# diff against now, so that cost is gone and the gate is worth having.
#
# Three things in upstream's 11-tool config were actively wrong for this tree:
#
#   1. black was pinned to 23.9.0 with `entry: black -t py39 -l 120 -S .`. The
#      literal `.` means every commit reformats the WHOLE tree regardless of
#      what is staged, so an unrelated one-line change arrives as a repo-wide
#      diff. The version, the line length and -S all disagree with the fleet.
#   2. codespell ran `-w`, which silently rewrites source during a commit.
#      It reports here instead; a speller should not be an unreviewed author.
#   3. isort, pyupgrade, autoflake, flake8 and prospector are five tools whose
#      rules this repo's own [tool.ruff.lint] already selects as I, UP, F, E
#      and W. Dropping them follows from the existing config, not from taste.
#
# no-commit-to-branch is also gone. It blocks main, and this is Travis's own
# project now rather than a fork tracking someone else's default branch.
#
# tests/data/ is excluded everywhere, and that exclusion is load-bearing rather
# than cosmetic. Those 77 files are byte-exact fixtures: running end-of-file-fixer
# or trailing-whitespace over tests/data/README or tests/data/commented_txt edits
# test INPUT, not formatting, and the resulting failure would look like a code
# regression. The exclusion also keeps the audio and .npz activation fixtures,
# which include the only tracked files above 500 KB, away from every hook.
#
# mypy is deliberately absent even though the fleet pins it at 1.18.2. This tree
# has never been type checked, so arming mypy would block every commit on day
# one. A gate that is wrong and toothless is a nuisance; wrong and armed is an
# outage. Type checking here is a project, not a hook.

# tests/data/ is excluded by path; .pkl is excluded by extension, deliberately NOT by directory.
# The 92 model files vendored out of the CPJKU submodule on 2026-08-28 are serialized weights, and
# codespell reads them as prose: it reported "fO ==> of, for, to, do, go" against binary floats and
# would have blocked every commit forever. check-added-large-files would also have refused them, at
# up to 3.8MB against its 500KB default.
#
# Excluding `^madmom/models/` instead would have been the obvious fix and the wrong one: it would
# also exclude madmom/models/__init__.py, which is SOURCE and is the entire reason those files were
# vendored rather than left in the submodule. That file declares all 20 model constants and, while
# it sat behind a gitlink, was the one Python file in this repo no gate could see.
exclude: '^tests/data/|\.pkl$'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ruff is ARMED as of 2026-08-29. It was not, and the reason it now can be is that
  # the backlog was triaged by RULE CLASS instead of by count.
  #
  # The history: arming it was the first thing tried and it reported 4212 errors.
  # 3920 of those (93%) were F403/F405 against a package layout deliberately built
  # on `from .x import *`. Ignoring those two left 292, which read as an
  # insurmountable backlog and kept the linter off. Per-file-ignores for F401 in
  # __init__.py (that is the public API, and ruff's fix deletes it) and E721 in
  # tests (the exact-type comparison is the assertion) took it to 187.
  #
  # Then the decisive measurement: 183 of those 187 were just three cosmetic rules,
  # UP031, UP008 and E402. They are now accepted backlog in pyproject.toml, with the
  # reasoning recorded there. That left FOUR findings, every one of them real, and
  # all four are fixed: an always-true `sys.version_info >= (3, 2)` guard, a stale
  # utf-8 coding line, a dead `__future__` import, and an ambiguous `l`.
  #
  # So the choice was never "clear 292 or stay unarmed". Sorting by rule class
  # turned a project into an afternoon, and the linter is now load-bearing: it
  # stops every NEW finding rather than documenting old ones. An earlier F821 it
  # found this way was a genuine runtime bug (models() raising NameError after
  # import); nothing else in the tree called that function, so no test could have
  # caught it.
  # rev pinned to the ruff on PATH (0.14.6) so the hook and a manual `ruff check`
  # cannot disagree. This repo already paid for that lesson with black, where three
  # installed copies at three versions meant "it passes locally" proved nothing.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
        name: ruff check

  - repo: https://github.com/psf/black
    rev: 25.11.0
    hooks:
      - id: black

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.5
    hooks:
      - id: codespell
        # No -w and no -i. Upstream ran `-w -i 3`: -w rewrites source during the
        # commit, and -i is an interactive prompt level, which a hook can never
        # answer. Reporting is the only useful mode here.
